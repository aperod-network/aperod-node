network: testnet
data_dir: ./data/testnet
log_level: info

p2p:
  listen_addr: "/ip4/0.0.0.0/tcp/30303"
  bootnodes: []
  max_peers: 50
  min_peers: 4
  # Rogue-peer / wrong-fork ban knobs (all optional — defaults shown below).
  # bad_block_height_lead: 1000   # how many blocks ahead of our tip triggers a strike
  # bad_block_ban_threshold: 10   # strikes within the TTL window before the IP is banned
  # bad_block_ban_duration: 24h   # how long the ban lasts

consensus:
  validator_key: "./data/testnet/validator.key"
  reward_address: "aproegZMzXpwdq4q72SZ4Wih2Li9H8eXE5q71MUabckAfaXrnDCZvBuGp547ozRMNTFpUMnrW1DQzQb5kYUdRLnCHxWHYGTFnC"
  block_reward_napro: 10000000
  block_time: "3s"

api:
  enabled: true
  listen_addr: "127.0.0.1:8545"
  cors:
    - "https://aperod.com"

genesis:
  file: "config/genesis-testnet.yaml"
