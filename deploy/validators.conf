# validators.conf — Aperod validator node inventory
#
# One entry per line.  Format:
#   <ssh-user>@<host-or-ip>
#
# Lines starting with # are comments.  Blank lines are ignored.
#
# Used by update-validator.sh to push a new aperod-node binary to every
# validator server after the main-node binary has been built and tested.
#
# Example:
#   aperod@203.0.113.10
#   aperod@203.0.113.20
#   root@validator-3.example.com
#
# ---------------------------------------------------------------------------
# SECURITY NOTES
# ---------------------------------------------------------------------------
# 1. The SSH key used must be installed on every validator listed here.
#    The default identity is ~/.ssh/id_ed25519; override with SSH_KEY env var.
#
# 2. Do NOT commit actual production IPs to a public repo.
#    If this repo is public, keep real IPs in a local override file and
#    reference it with:
#      VALIDATORS_CONF=/etc/aperod/validators.conf bash update-validator.sh
#
# ---------------------------------------------------------------------------
# Add your validators below:
# ---------------------------------------------------------------------------

# aperod@<validator-1-ip>
# aperod@<validator-2-ip>
