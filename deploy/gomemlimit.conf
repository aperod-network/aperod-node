# Aperod node — GOMEMLIMIT drop-in (canonical source of truth)
#
# Install path on a node:
#   /etc/systemd/system/aperod-node.service.d/gomemlimit.conf
#
# GOMEMLIMIT caps the Go heap so the runtime triggers GC before the kernel
# OOM-killer fires.  Without this cap the node's RSS can grow past available
# RAM, triggering SIGKILL mid-write and corrupting the LevelDB snapshot.
#
# ── SOURCE OF TRUTH ─────────────────────────────────────────────────────────
# This file is the single canonical value for the node GOMEMLIMIT ceiling.
# To change the production limit, edit the number below (in bytes) and nothing
# else — verify-dropin.sh parses the expected value directly from this file so
# the check never goes stale.
#
#   5905580032 bytes = 5632 MiB = 5.5 GiB
[Service]
Environment="GOMEMLIMIT=5905580032"
