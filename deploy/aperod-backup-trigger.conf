# tmpfiles.d — creates /run/aperod owned by the 'aperod' user
# so that aperod-api (running as user 'aperod', NoNewPrivileges=true)
# can write the backup trigger file without any sudo.
#
# Deploy:
#   sudo cp blockchain/deploy/aperod-backup-trigger.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/aperod-backup-trigger.conf
#
# Format: type  path          mode  user    group  age argument
d         /run/aperod         0775  aperod  aperod  -
