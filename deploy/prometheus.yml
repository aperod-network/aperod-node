# Prometheus scrape config for Aperod production monitoring.
#
# Usage on the server (systemd service installed via apt-get install prometheus):
#   cp /opt/aperod/blockchain/deploy/prometheus.yml /etc/prometheus/prometheus.yml
#   systemctl restart prometheus
#
# Then point Grafana at http://localhost:9090 as a Prometheus data source
# and import grafana-dashboard.json.
#
# Required exporters:
#   node_exporter — listens on 127.0.0.1:9100, including the systemd collector.
# No backup or Backblaze metrics are configured on this host.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/aperod-mainnet.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # ── 1. Aperod Go node — chain height, mempool, peers, validators ──────────
  - job_name: aperod-node
    static_configs:
      - targets: ["127.0.0.1:18545"]
        labels:
          service: aperod-node

  # ── Local validator status, cross-checked against key, registry, and peers ──
  - job_name: aperod-validator-health
    static_configs:
      - targets: ["127.0.0.1:18547"]
        labels:
          service: aperod-validator-health

  # ── 2. Node.js API server — HTTP counters, daily payout job outcomes ──────
  # Scraped on port 3001 (nginx on :80 does 301→HTTPS so Prometheus can't follow it).
  - job_name: aperod-api-server
    metrics_path: /api/metrics
    static_configs:
      - targets: ["127.0.0.1:3001"]
        labels:
          service: aperod-api-server

  # ── 3. node_exporter — CPU, RAM, disk, network and systemd services ───────
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: node-exporter

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels:
          service: alertmanager
