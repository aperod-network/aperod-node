# Prometheus scrape config for Aperod production monitoring.
#
# Usage on the server (systemd service installed via apt-get install prometheus):
#   cp /opt/aperod/blockchain/deploy/prometheus.yml /etc/prometheus/prometheus.yml
#   systemctl restart prometheus
#
# Then point Grafana at http://localhost:9090 as a Prometheus data source
# and import grafana-dashboard.json.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Go node — chain height, mempool, peers, validators (blockchain/api/server.go handleMetrics).
  - job_name: aperod-node
    static_configs:
      - targets: ["127.0.0.1:8545"]
        labels:
          service: aperod-node

  # Node.js API server — HTTP request counters + daily payout job outcomes
  # (artifacts/api-server/src/routes/metrics.ts).
  # Scraped directly on port 3001 (nginx on :80 does 301→HTTPS so Prometheus can't follow it).
  - job_name: aperod-api-server
    metrics_path: /api/metrics
    static_configs:
      - targets: ["127.0.0.1:3001"]
        labels:
          service: aperod-api-server

  # System metrics — CPU, RAM, disk, network (prometheus-node-exporter on :9100).
  # Installed automatically as a dependency of prometheus on Ubuntu.
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: server

  # Nginx traffic — requests/sec, connections, active workers.
  # Requires: nginx stub_status + nginx-prometheus-exporter on :9113.
  # Setup: see deploy README or follow the instructions provided with the dashboard.
  - job_name: nginx
    static_configs:
      - targets: ["127.0.0.1:9113"]
        labels:
          service: nginx
