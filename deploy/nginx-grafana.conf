# ==========================================================
# Nginx configuration snippet — Grafana at /grafana subpath
# Add this inside your server { } block for aperod.com
#
# Also set in /etc/grafana/grafana.ini:
#   [server]
#   root_url = https://aperod.com/grafana/
#   serve_from_sub_path = true
#
# Then: systemctl restart grafana-server nginx
# ==========================================================

location /grafana/ {
    proxy_pass          http://127.0.0.1:3000/;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade    $http_upgrade;
    proxy_set_header    Connection "upgrade";
    # Strip /grafana prefix before passing to Grafana
    rewrite ^/grafana/(.*) /$1 break;
}

location /grafana {
    return 301 /grafana/;
}
