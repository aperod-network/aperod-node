# ==========================================================
# Nginx snippet — Grafana at /grafana/ subpath
# Usage: paste these two location blocks INSIDE your existing
#        server { } block for aperod.com (do NOT drop this
#        file directly into conf.d/ — it must be inside a
#        server block).
#
# Quickest way on the server:
#   sudo nano /etc/nginx/sites-available/aperod.com
#   # paste the two location blocks below before the closing }
#   sudo nginx -t && sudo systemctl reload nginx
#
# Also set in /etc/grafana/grafana.ini:
#   [server]
#   root_url = https://aperod.com/grafana/
#   serve_from_sub_path = true
#
# Then: sudo systemctl restart grafana-server
# ==========================================================

# --- PASTE INSIDE server { } --------------------------------

    location /grafana/ {
        proxy_pass          http://127.0.0.1:3000/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    location = /grafana {
        return 301 /grafana/;
    }

# --- END PASTE -----------------------------------------------
