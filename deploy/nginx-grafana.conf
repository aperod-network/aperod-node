# ==========================================================
# Nginx snippet — Grafana по субпути /grafana/
#
# Использование: вставьте два блока location ВНУТРИ
#   существующего server { } блока для aperod.com
#   (НЕ кладите файл напрямую в conf.d/ — он должен быть
#   внутри блока server {}).
#
# Быстрый способ на сервере:
#   sudo nano /etc/nginx/sites-available/aperod.com
#   # вставьте блоки location ПЕРЕД закрывающей }
#   sudo nginx -t && sudo systemctl reload nginx
#
# Также задайте в /etc/grafana/grafana.ini:
#   [server]
#   root_url = https://aperod.com/grafana/
#   serve_from_sub_path = true
#
# Затем: sudo systemctl restart grafana-server
# ==========================================================

# --- ВСТАВЬТЕ ВНУТРЬ server { } --------------------------------

    # Grafana — субпуть /grafana/
    # ВАЖНО: proxy_pass должен содержать /grafana/ (не просто /),
    # иначе JS-ресурсы Grafana (/grafana/public/config.js и т.п.)
    # будут проксироваться в /api/ вашего API-сервера.
    location /grafana/ {
        proxy_pass          http://127.0.0.1:3000/grafana/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        # Отключаем буферизацию для SSE (live-данные Grafana)
        proxy_buffering     off;
    }

    location = /grafana {
        return 301 /grafana/;
    }

# --- КОНЕЦ ВСТАВКИ -------------------------------------------
