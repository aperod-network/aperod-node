network: testnet
  data_dir: ./data/testnet
  log_level: info

  p2p:
    listen_addr: "/ip4/0.0.0.0/tcp/30303"
    bootnodes: []
    max_peers: 50
    min_peers: 4

  consensus:
    validator_key: ""         # path to ED25519 private key file (leave empty for non-validator)
    reward_address: ""        # APR address for block rewards — get yours at https://t.me/aperod_bot
    block_time: "1s"

  api:
    enabled: true
    listen_addr: "127.0.0.1:8545"
    cors:
      - "http://localhost:3000"

  genesis:
    file: "config/genesis-testnet.yaml"
  