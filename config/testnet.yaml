network: testnet
data_dir: ./data/testnet
log_level: info

p2p:
  listen_addr: "/ip4/0.0.0.0/tcp/30303"
  bootnodes: []
  max_peers: 50
  min_peers: 4
  # get_block_stall_timeout: "15s"  # How long to wait for a MsgBlock reply
  #                                  # before re-issuing MsgGetHeaders.
  #                                  # Lower values recover faster on reliable
  #                                  # LANs; raise to "30s"–"60s" on high-
  #                                  # latency or pruned-node setups to avoid
  #                                  # spurious stall warnings.  Default: 15s.

consensus:
  validator_key: ""          # path to ED25519 private key file (leave empty for non-validator)
  reward_address: ""         # APRO wallet address for block rewards — get yours at https://t.me/aperod_bot
  block_reward_napro: 10000000  # 0.1 APRO (10_000_000 nAPRO); 0 = use default
  # 0 = disabled. Set the same future height on every validator.
  reward_authorization_activation_height: 0
  block_time: "3s"
  # non_validator: true      # Set to true to run a sync-only / relay / RPC node.
  #                          # The node validates and relays every block but never
  #                          # proposes or signs blocks, so it cannot cause a chain
  #                          # split.  validator_key is still loaded for P2P identity
  #                          # if specified; omit it to auto-generate an ephemeral key.
  # Pool-based block rewards (deflationary from day 1).
  # Validator rewards are drawn from the pre-allocated 2B staking pool instead
  # of minting new tokens.  Total Supply stays at 10B genesis and DECREASES as
  # EIP-1559 base fees are burned.  After the pool is exhausted, tail_reward_napro
  # is minted per block (tail emission phase).
  # Set staking_pool_napro: 0 to revert to the legacy halving-mint schedule.
  staking_pool_napro: 200000000000000000  # 2 000 000 000 APRO × 10^8 nAPRO/APRO
  tail_reward_napro: 100000000            # 1 APRO/block tail emission after pool exhaustion
  oracle_url: "http://localhost:8080/api/v1/oracle/price"  # APRO/USD price endpoint (Node.js API server).
                                                          # Production systemd unit (aperod-api.service) binds to port 8080.
                                                          # Dev: port 3000.  Empty = skip embedding.
  oracle_max_deviation: 0.05                               # reject peer blocks whose price deviates >5%

api:
  enabled: true
  listen_addr: "127.0.0.1:8545"
  cors:
    - "http://localhost:3000"

genesis:
  file: "config/genesis-testnet.yaml"

# Pruning controls on-disk block history retention.
# mode: "archive" — keep all block data forever (default, recommended for explorers/RPC nodes)
# mode: "light"   — strip RingCT/Bulletproof tx data from blocks older than keep_blocks
#                   (reduces disk usage by ~70-80%; headers + UTXO set are always kept)
pruning:
  mode: "archive"
  keep_blocks: 100000   # ~3.5 days at 3 s/block; ignored in archive mode

# pprof — Go runtime profiling endpoint (CPU, heap, goroutine, trace).
# Disabled by default.  Enable only when diagnosing a live CPU/memory incident;
# disable again afterwards.  listen_addr MUST be a loopback address (127.0.0.1).
#
# Usage once enabled:
#   # 30-second CPU flame graph
#   go tool pprof http://127.0.0.1:8546/debug/pprof/profile?seconds=30
#   # heap snapshot
#   go tool pprof http://127.0.0.1:8546/debug/pprof/heap
#   # goroutine dump
#   curl -s http://127.0.0.1:8546/debug/pprof/goroutine?debug=2
#pprof:
#  enabled: true
#  listen_addr: "127.0.0.1:8546"
