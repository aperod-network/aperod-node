network: testnet
data_dir: ./data/testnet
log_level: info

p2p:
  listen_addr: "/ip4/0.0.0.0/tcp/30303"
  bootnodes: []
  max_peers: 50
  min_peers: 4

consensus:
  validator_key: ""          # path to ED25519 private key file (leave empty for non-validator)
  reward_address: ""         # APRO wallet address for block rewards — get yours at https://t.me/aperod_bot
  block_reward_napro: 10000000  # 0.1 APRO (10_000_000 nAPRO); 0 = use default
  block_time: "3s"
  oracle_url: "http://localhost:3000/api/v1/oracle/price"  # APRO/USD price endpoint (Node.js API server); empty = skip embedding
  oracle_max_deviation: 0.05                               # reject peer blocks whose price deviates >5%

api:
  enabled: true
  listen_addr: "127.0.0.1:8545"
  cors:
    - "http://localhost:3000"

genesis:
  file: "config/genesis-testnet.yaml"

# Pruning controls on-disk block history retention.
# mode: "archive" — keep all block data forever (default, recommended for explorers/RPC nodes)
# mode: "light"   — strip RingCT/Bulletproof tx data from blocks older than keep_blocks
#                   (reduces disk usage by ~70-80%; headers + UTXO set are always kept)
pruning:
  mode: "archive"
  keep_blocks: 100000   # ~3.5 days at 3 s/block; ignored in archive mode
