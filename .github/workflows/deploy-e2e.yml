name: Deploy E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-e2e.yml'
    branches: [main, master, develop]
  pull_request:
    paths:
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-e2e.yml'

permissions:
  contents: read

jobs:
  install-node-e2e:
    name: install-node.sh e2e smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [install, validator, update, upgrade]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify isolated test runtime
        run: docker info
      - name: Real systemd lifecycle in isolated guest
        env:
          APEROD_RUN_DOCKER_E2E: "1"
        run: bash deploy/test-node-service-lifecycle.sh "${{ matrix.mode }}"
