version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec
    - unconvert
    - unparam
    - godot
  disable:
    - exhaustruct
    - exhaustive
    - wrapcheck

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/aperod/aperod
  revive:
    rules:
      - name: exported
        severity: warning
      - name: var-naming
        severity: warning
      - name: error-return
        severity: warning
  gosec:
    excludes:
      - G404
  misspell:
    locale: US
  godot:
    scope: declarations
    period: true

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - gosec
        - unparam
        - godot
    - path: "fuzz_test\\.go"
      linters:
        - godot
  max-issues-per-linter: 50
  max-same-issues: 10
